name: Build and push image
on:
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - Dockerfile
      - wgcf-connector.sh
  workflow_dispatch:
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  build:
    outputs:
      image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=edge,branch=main
            
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Test image
        run: |
          image=${image,,}
          rc=0
          docker run --rm "$image" || rc=$?
          [ $rc -eq 2 ] || { echo "::error::Expected usage error without a token"; exit 1; }
          docker run --rm --entrypoint sh "$image" -c '
            dbus-daemon --system
            warp-svc > /dev/null 2>&1 &
            i=0
            until warp-cli --accept-tos status > /dev/null 2>&1; do
              i=$((i + 1))
              [ $i -lt 30 ] || { echo "warp-svc did not start"; exit 1; }
              sleep 1
            done
            warp-cli --accept-tos connector new eyJhIjoiaW52YWxpZCJ9 2>&1 | grep -q "Failed to parse WARP Connector token"' ||
            { echo "::error::warp-svc did not start or warp-cli did not reject an invalid token"; exit 1; }
        env:
          image: ${{ needs.build.outputs.image }}